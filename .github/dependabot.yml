# Weekly pull requests for outdated libraries and GitHub Actions; security fixes come right away.
# Library updates are grouped so they arrive as one pull request, checked by CI before merging.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["androidx.*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
